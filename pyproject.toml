[project]
name = "lumen"
version = "0.1.0"
description = "Multi-tenant RAG semantic document search: FastAPI API, arq ingestion workers, hybrid retrieval with RRF + reranking, Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pymongo>=4.13",
    "redis>=5,<6",
    "arq>=0.26",
    "openai>=1.50",
    "tiktoken>=0.8",
    "numpy>=2.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running MongoDB and Redis (skipped automatically when unavailable)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Line length is the formatter's job; long prompt strings are left intact on purpose.
ignore = ["B008", "E501"]
