name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -e ".[ui,dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Integration tests skip themselves if Mongo/Redis are unreachable; here they must run.
      - run: pytest -q -rs
      - name: Retrieval eval (mock providers)
        run: python -m eval.run_eval

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumen-py:${{ github.sha }} .
      - name: Boot the full stack and run the smoke test
        run: |
          cp .env.example .env
          docker compose up -d --build api worker mongo redis
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          docker compose exec -T api python -m lumen.seed
          docker compose exec -T api python scripts/smoke.py http://localhost:8000
      - if: always()
        run: docker compose logs api worker | tail -100
